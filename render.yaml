services:
  - type: web
    name: ai-lawyer
    runtime: docker
    plan: free
    branch: main
    repo: https://github.com/KunFirst-ST/AI-lawyer.git
    autoDeployTrigger: commit
    healthCheckPath: /public/health.php
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: REGISTRATION_RATE_LIMIT
        value: "10"
      - key: PASSWORD_MIN_LENGTH
        value: "8"
      - key: AUTO_LOGIN_AFTER_REGISTER
        value: "false"
      - key: REQUIRE_TERMS_ACCEPTANCE
        value: "true"
      - key: LAWYER_REGISTRATION_ENABLED
        value: "true"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: storage/render.sqlite
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_ENDPOINT
        value: https://api.openai.com/v1/chat/completions
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Thanai Khu Dee
      - key: MAIL_SEND_IMMEDIATELY
        value: "true"
      - key: MAIL_NOTIFY_TYPES
        value: account,booking,payment,match,lawyer_status,contact,message
      - key: MAIL_MESSAGE_COOLDOWN_SECONDS
        value: "300"
